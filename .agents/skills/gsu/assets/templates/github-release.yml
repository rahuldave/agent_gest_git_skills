# The tasker role wrote this file once, when the project had none. It is yours from then on.
# It runs on each push to main. The job check runs just check on the pushed commit. When it passes, the job release
# runs just release, which makes the next tag vX.Y.Z by semver, pushes it and checks it. A push that needs no release,
# such as a change of only the docs, makes no tag. Nobody tags by hand.
# just release takes the number from the commits since the last tag. A pull request does not raise the version of
# the manifest. When the language profiles give a version below the bump that the commits ask for, just release
# writes the bump into the version files and lock files, commits it as "chore(release): vX.Y.Z" by
# github-actions[bot], and pushes that commit to main and its tag together. That commit asks for no bump, so the next
# run stops at its tag. The commit gate passes it, since its author is a GitHub bot.
# A push with the GITHUB_TOKEN starts no other workflow, so the version commit gets no CI run of its own. It changes
# only the version lines. A rule of main that asks for a pull request blocks the push: let GitHub Actions bypass it.
# No agent runs here. The checkout has fetch-depth: 0, so the script sees each tag and each commit.
# just release needs a clean checkout, so run it in its own job, after no step that changes tracked files.
# Only the job release can write to the repository, to push the commit and the tag. A tag that the GITHUB_TOKEN
# pushes starts no other workflow, so put a publish job in this workflow, with needs: release. The tag can be on the
# version commit, not on the pushed commit, so the job checks out needs.release.outputs.tag, as in:
#   binaries:
#     needs: release
#     if: needs.release.outputs.tag != ''
#     steps:
#       - uses: actions/checkout@v4
#         with:
#           ref: ${{ needs.release.outputs.tag }}
# When binaries or publish failed, use "Re-run failed jobs", which keeps the tag of the job release. "Re-run all
# jobs" runs just release again on the pushed commit. It finds the tag on the version commit, prints "already
# released" and gives the tag again. To build a tag by hand, run this workflow with the tag:
# gh workflow run release --ref main -f tag=vX.Y.Z. The job release then skips just release, checks that the tag
# exists and gives it as its output. It makes no new tag.
# Add the setup of the tools of your languages before the step "Check", if just check needs them.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag vX.Y.Z to build and publish. The run makes no new tag."
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags, for the step release-check of just check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Install jlog
        # The tag v0.4.0 of jlog is the commit 6078806, as in the CI of jnterfaces. install.sh comes from the tag. It
        # downloads the release binary, checks its SHA-256 and puts it in ~/.local/bin. setup-uv comes first, so
        # install.sh makes the environments of the plugins. The step shell bash has pipefail, so a failed
        # download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.4.0/scripts/install.sh | sh -s -- --tag v0.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The Rust steps run only in a project with a toolchain file, so the workflow works for any language. rustup
      # reads the file, so the workflow names no channel, and CI runs the compiler of each machine of the project.
      # just install of jnterfaces writes the file, with the exact version of the Rust of the machine. Do not set
      # RUSTUP_TOOLCHAIN: it would take the place of the file, so the step stops when it is set.
      - name: Stop a Rust project that has no toolchain file
        # Without the file, the Rust steps would skip, and a later step that runs cargo would fail on a missing
        # cargo-llvm-cov.
        if: hashFiles('Cargo.toml') != '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') == ''
        shell: bash
        run: |
          echo "::error::The project has a Cargo.toml and no rust-toolchain.toml. Run just install, which writes rust-toolchain.toml with the exact version of the Rust of your machine, then commit the file."
          exit 1
      - name: Install the Rust toolchain of rust-toolchain.toml
        id: rust
        if: hashFiles('rust-toolchain.toml', 'rust-toolchain') != ''
        shell: bash
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "::error::RUSTUP_TOOLCHAIN is set. Remove it, so that the toolchain file names the toolchain."
            exit 1
          fi
          rustup toolchain install
          # just check needs clippy, rustfmt and llvm-tools-preview. rustup adds them to the toolchain of the file.
          rustup component add clippy rustfmt llvm-tools-preview
          # The key of the cache holds the compiler that runs, as rustc -V prints it, not the channel of the file. So
          # a channel that moves, such as stable, gets a new key with each new compiler. "rustc 1.95.0 (59807616e
          # 2026-04-14)" becomes 1.95.0-59807616e-2026-04-14.
          toolchain="$(rustc -V | sed -E 's/^rustc //; s/[^A-Za-z0-9._]+/-/g; s/^-+//; s/-+$//')"
          if [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]]; then
            echo "::error::rustc -V printed no version of Rust, so the cache has no key."
            exit 1
          fi
          # The channel of the file. rustup reads rust-toolchain first when both are there. An exact version, or a
          # nightly or beta of one day, stays the same compiler. Any other channel moves, so CI and each machine can
          # run different compilers.
          channel="$(python3 -I -c '
          import pathlib, re, tomllib
          names = [pathlib.Path(name) for name in ("rust-toolchain", "rust-toolchain.toml")]
          text = next(path for path in names if path.is_file()).read_text()
          try:
              channel = tomllib.loads(text)["toolchain"]["channel"]
          except (tomllib.TOMLDecodeError, KeyError, TypeError):
              channel = text.strip()
          print(channel if isinstance(channel, str) and re.fullmatch(r"[A-Za-z0-9._-]+", channel) else "")
          ')" || channel=""
          # The channel only feeds the warning, so a failed read of the file never stops the step. A host triple after
          # the version, such as 1.95.0-x86_64-unknown-linux-gnu, keeps the version exact.
          if [[ ! "$channel" =~ ^([0-9]+\.[0-9]+\.[0-9]+|(nightly|beta)-[0-9]{4}-[0-9]{2}-[0-9]{2})(-[a-z0-9_]+(-[a-z0-9_]+){1,3})?$ ]]; then
            echo "::warning::The toolchain file names no exact version (${channel:-no channel}). Write the version that rustc -V prints, such as channel = \"1.95.0\", so that CI and each machine run the same compiler."
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      # cargo-llvm-cov comes as a release binary, so no run compiles it. Keep the version as the profile pins it.
      - name: Install cargo-llvm-cov
        if: steps.rust.outputs.toolchain != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # With JNPROFILE_RUST_NEXTEST=1, jnprofile-rust runs its integration tests with cargo llvm-cov nextest, which
      # needs cargo-nextest. It comes as a release binary too, only when the env of the workflow or of this job sets
      # the variable to 1, as in: env: {JNPROFILE_RUST_NEXTEST: "1"}. Set it in check.yml and in release.yml alike.
      - name: Install cargo-nextest
        if: steps.rust.outputs.toolchain != '' && env.JNPROFILE_RUST_NEXTEST == '1'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # The cache keeps the crates that cargo downloads and the whole build folder, target/ with
      # target/llvm-cov-target, the warm build of coverage. Keep all of target/: the new build layout of cargo puts
      # files under target/debug/build/<pkg>/<hash>/out/, so a cache of only target/debug/deps misses them. The
      # key is the runner, the compiler, the word check, the hash of each Cargo.lock
      # and the commit. Each job that runs just check uses the word check, on a pull request and on main, so a pull
      # request restores the cache of main. A restore takes the newest cache with the same Cargo.lock, else the
      # newest cache of the same compiler. A run reads the caches of its own branch and of the default branch only.
      # Set no CARGO* or RUST* variable from a value that changes on each run, such as github.run_id: the coverage
      # build keeps a fingerprint of these variables, and a new value makes it clean the whole build. The commit in
      # the key is no such variable.
      - name: Restore the Rust cache
        id: rust-cache
        if: steps.rust.outputs.toolchain != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-check-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-check-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.toolchain }}-check-
      - name: Check
        run: just check
      # Only a push to main saves the cache, so a pull request or a manual run saves none. The key holds the commit,
      # so each push to main saves a new cache, and the next run restores the newest. Only a run again of the same
      # commit finds its key exactly, and then the cache is already saved. Only a passed check saves.
      - name: Save the Rust cache
        if: >-
          steps.rust.outputs.toolchain != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The tag that the run made, or that was already released, or the given tag, else empty.
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.given.outputs.tag }}
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      # The Rust steps run only in a project with a toolchain file, so the workflow works for any language. rustup
      # reads the file, so the workflow names no channel, and CI runs the compiler of each machine of the project.
      # just install of jnterfaces writes the file, with the exact version of the Rust of the machine. Do not set
      # RUSTUP_TOOLCHAIN: it would take the place of the file, so the step stops when it is set.
      - name: Stop a Rust project that has no toolchain file
        # Without the file, the Rust steps would skip, and a later step that runs cargo would fail on a missing
        # cargo-llvm-cov.
        if: hashFiles('Cargo.toml') != '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') == ''
        shell: bash
        run: |
          echo "::error::The project has a Cargo.toml and no rust-toolchain.toml. Run just install, which writes rust-toolchain.toml with the exact version of the Rust of your machine, then commit the file."
          exit 1
      - name: Install the Rust toolchain of rust-toolchain.toml
        id: rust
        if: hashFiles('rust-toolchain.toml', 'rust-toolchain') != ''
        shell: bash
        run: |
          if [ -n "${RUSTUP_TOOLCHAIN:-}" ]; then
            echo "::error::RUSTUP_TOOLCHAIN is set. Remove it, so that the toolchain file names the toolchain."
            exit 1
          fi
          rustup toolchain install
          # just check needs clippy, rustfmt and llvm-tools-preview. rustup adds them to the toolchain of the file.
          rustup component add clippy rustfmt llvm-tools-preview
          # The key of the cache holds the compiler that runs, as rustc -V prints it, not the channel of the file. So
          # a channel that moves, such as stable, gets a new key with each new compiler. "rustc 1.95.0 (59807616e
          # 2026-04-14)" becomes 1.95.0-59807616e-2026-04-14.
          toolchain="$(rustc -V | sed -E 's/^rustc //; s/[^A-Za-z0-9._]+/-/g; s/^-+//; s/-+$//')"
          if [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]]; then
            echo "::error::rustc -V printed no version of Rust, so the cache has no key."
            exit 1
          fi
          # The channel of the file. rustup reads rust-toolchain first when both are there. An exact version, or a
          # nightly or beta of one day, stays the same compiler. Any other channel moves, so CI and each machine can
          # run different compilers.
          channel="$(python3 -I -c '
          import pathlib, re, tomllib
          names = [pathlib.Path(name) for name in ("rust-toolchain", "rust-toolchain.toml")]
          text = next(path for path in names if path.is_file()).read_text()
          try:
              channel = tomllib.loads(text)["toolchain"]["channel"]
          except (tomllib.TOMLDecodeError, KeyError, TypeError):
              channel = text.strip()
          print(channel if isinstance(channel, str) and re.fullmatch(r"[A-Za-z0-9._-]+", channel) else "")
          ')" || channel=""
          # The channel only feeds the warning, so a failed read of the file never stops the step. A host triple after
          # the version, such as 1.95.0-x86_64-unknown-linux-gnu, keeps the version exact.
          if [[ ! "$channel" =~ ^([0-9]+\.[0-9]+\.[0-9]+|(nightly|beta)-[0-9]{4}-[0-9]{2}-[0-9]{2})(-[a-z0-9_]+(-[a-z0-9_]+){1,3})?$ ]]; then
            echo "::warning::The toolchain file names no exact version (${channel:-no channel}). Write the version that rustc -V prints, such as channel = \"1.95.0\", so that CI and each machine run the same compiler."
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - name: Name the author of the tag and of the version commit
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # just release writes tag=vX.Y.Z to GITHUB_OUTPUT.
      - name: Release
        if: github.event_name == 'push'
        id: release
        run: just release
      # A run by hand: the tag must be a release tag that exists.
      - name: Take the given tag
        if: github.event_name == 'workflow_dispatch'
        id: given
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || { echo "not a release tag vX.Y.Z: $TAG" >&2; exit 1; }
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
