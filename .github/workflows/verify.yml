name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-skill-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # The whole history and the tags, for just release-check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Get jnterfaces, whose link checker the lint runs and whose installer install-test runs
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rahuldave/jnterfaces.git "$RUNNER_TEMP/jnterfaces"
          git -C "$RUNNER_TEMP/jnterfaces" checkout --quiet "$(cat scripts/jnterfaces_commit)"
          echo "JNTERFACES_DIR=$RUNNER_TEMP/jnterfaces" >> "$GITHUB_ENV"
      - name: Install jlog v0.3.0, which the jnterfaces installer needs
        # The tag v0.3.0 of jlog is the commit d4b712b, as in the CI of jnterfaces. install.sh comes from the tag. It
        # downloads the release binary, checks its SHA-256 and puts it in ~/.local/bin. setup-uv comes first, so
        # install.sh makes the environments of the plugins. The step shell bash has pipefail, so a failed download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.3.0/scripts/install.sh | sh -s -- --tag v0.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # CI runs just check and no other check, so a developer finds each failure of CI with just check.
      - name: Check the release, the lint, the manifest, the labs, the install, the source archive, the docs site and the diff
        run: just check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-package
          path: dist/
          if-no-files-found: error

  # On a push to main, after the verify job passed, tag the next release with just release. No agent runs here.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release
