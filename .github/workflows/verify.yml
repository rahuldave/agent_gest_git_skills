name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-skill-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # The whole history and the tags, for just release-check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Get jnterfaces, whose link checker the lint runs and whose installer install-test runs
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rahuldave/jnterfaces.git "$RUNNER_TEMP/jnterfaces"
          git -C "$RUNNER_TEMP/jnterfaces" checkout --quiet "$(cat scripts/jnterfaces_commit)"
          echo "JNTERFACES_DIR=$RUNNER_TEMP/jnterfaces" >> "$GITHUB_ENV"
      - name: Install jlog v0.4.0, which the jnterfaces installer needs
        # The tag v0.4.0 of jlog is the commit 6078806, as in the CI of jnterfaces. install.sh comes from the tag. It
        # downloads the release binary, checks its SHA-256 and puts it in ~/.local/bin. setup-uv comes first, so
        # install.sh makes the environments of the plugins. The step shell bash has pipefail, so a failed download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.4.0/scripts/install.sh | sh -s -- --tag v0.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install gest v0.6.0 and jagt v0.6.4, which the tasker role needs
        # jnterfaces 0.3.0 stops an install when a required program of a package is not on PATH, so install-test needs
        # them. install.sh of gest comes from its tag v0.6.0, and install.sh of jagt from its tag
        # v0.6.4, as in the CI of jnterfaces. Each one checks the SHA-256.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/gest/v0.6.0/scripts/install.sh | sh -s -- --tag v0.6.0
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jagt/v0.6.4/scripts/install.sh | sh -s -- --tag v0.6.4
      # CI runs just check and no other check, so a developer finds each failure of CI with just check.
      - name: Check the release, the gate trailers, the lint, the manifest, the labs, the install, the source archive, the docs site and the diff
        run: just check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-package
          path: dist/
          if-no-files-found: error

  # On a push to main, after the verify job passed, tag the next release with just release. No agent runs here. This
  # repository has no language profile, so the release makes no version commit and only tags HEAD.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # The tag that the run made, or that was already on HEAD, else empty.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        id: release
        run: just release

  # On a push to main, after the job verify passed, build the site and push it to gh-pages, which GitHub Pages serves.
  # The sitemap dates each page by the time of its file, which a fresh checkout sets, so most runs commit to gh-pages.
  # No agent runs here.
  docs:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time. A newer run cancels an older publish, waiting or running, and publishes the tip of main
    # itself. A push of git is atomic, so a cancelled publish leaves gh-pages as it was.
    concurrency:
      group: docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the commit of gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish the site of the tip of main
        # The verify of an older push can end after that of a newer one, and a newer run can cancel an older one. So
        # each run publishes the tip of main, not its own commit, and the run that ends last publishes the newest site.
        shell: bash
        run: |
          git fetch --quiet origin main
          git checkout --quiet --detach FETCH_HEAD
          echo "publishing the site of main at $(git rev-parse HEAD)"
          just docs-publish
