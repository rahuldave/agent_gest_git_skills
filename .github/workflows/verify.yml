name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-skill-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Get jnterfaces, whose link checker the lint runs
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rahuldave/jnterfaces.git "$RUNNER_TEMP/jnterfaces"
          git -C "$RUNNER_TEMP/jnterfaces" checkout --quiet a1de35a282dc92bcb386bb0554db8912c1970fa6
          echo "JNTERFACES_DIR=$RUNNER_TEMP/jnterfaces" >> "$GITHUB_ENV"
      - name: Keep the build of jlog
        id: jlog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/jlog
          key: jlog-v0.1.0-${{ runner.os }}
      - name: Install jlog v0.1.0, which the jnterfaces installer needs
        if: steps.jlog.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/rahuldave/jlog --tag v0.1.0
      - name: Check contracts, hooks, and source mirrors
        run: just lint
      - name: Restack a plain-git stack after an amend, a new commit and a squash merge
        run: just stack-rebase-lab
      - name: Install this package with the jnterfaces installer, then remove it
        run: just install-test
      - name: Validate package manifest with skill-package-maker
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$(mktemp -d)"
          trap 'rm -rf -- "$tool_root"' EXIT
          git clone --quiet https://github.com/rahuldave/agent_skill_package_maker.git "$tool_root/package-maker"
          git -C "$tool_root/package-maker" checkout --quiet 6a5938c49ca71c374dc1a234a4d15134c484a741
          uv run --no-project python "$tool_root/package-maker/skills/skill-package-maker/scripts/lint_skill_bundle.py" .
      - name: Build and verify source distribution archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix=agent_gest_git_skills/ -o dist/agent_gest_git_skills-source.tar.gz HEAD
          tar -tzf dist/agent_gest_git_skills-source.tar.gz | grep -Fx 'agent_gest_git_skills/skill-package.json'
          tar -tzf dist/agent_gest_git_skills-source.tar.gz | grep -Fx 'agent_gest_git_skills/.agents/skills/gest_git_installer/SKILL.md'
          (cd dist && sha256sum agent_gest_git_skills-source.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-package
          path: dist/
          if-no-files-found: error
